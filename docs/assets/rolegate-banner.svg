<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">RoleGate Keycloak authentication flow banner</title>
  <desc id="desc">A banner showing Keycloak checking a client role before allowing access to an application.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102033"/>
      <stop offset="0.45" stop-color="#14324B"/>
      <stop offset="1" stop-color="#1E3A2F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#48C6EF"/>
      <stop offset="1" stop-color="#6FE7A7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <path d="M0 278C148 220 249 308 418 250C575 196 626 114 788 142C959 172 1034 260 1280 198V360H0V278Z" fill="#0F766E" opacity="0.18"/>
  <path d="M0 74C140 38 254 76 388 52C543 24 688 -18 850 42C1001 98 1109 64 1280 24V0H0V74Z" fill="#38BDF8" opacity="0.12"/>

  <g filter="url(#shadow)">
    <rect x="83" y="76" width="1114" height="208" rx="22" fill="#0B1220" opacity="0.72"/>
    <rect x="83.5" y="76.5" width="1113" height="207" rx="21.5" stroke="url(#accent)" stroke-opacity="0.42"/>
  </g>

  <g transform="translate(132 126)">
    <rect x="0" y="0" width="142" height="96" rx="16" fill="#111827" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="40" cy="48" r="18" fill="#38BDF8" opacity="0.9"/>
    <path d="M78 34H112M78 48H124M78 62H104" stroke="#E5F6FF" stroke-width="7" stroke-linecap="round"/>
    <text x="71" y="124" text-anchor="middle" fill="#CFE8F3" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">User</text>
  </g>

  <path d="M304 174H435" stroke="#93C5FD" stroke-width="4" stroke-linecap="round"/>
  <path d="M425 160L443 174L425 188" stroke="#93C5FD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(462 93)">
    <rect x="0" y="0" width="356" height="174" rx="18" fill="#082F49" stroke="#7DD3FC" stroke-width="2"/>
    <text x="178" y="47" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">RoleGate</text>
    <text x="178" y="83" text-anchor="middle" fill="#BAE6FD" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500">Keycloak Browser Flow</text>
    <rect x="45" y="108" width="266" height="42" rx="21" fill="#0F172A" stroke="#6FE7A7" stroke-width="2"/>
    <text x="178" y="136" text-anchor="middle" fill="#D1FAE5" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">client.role required</text>
  </g>

  <path d="M848 174H979" stroke="#93C5FD" stroke-width="4" stroke-linecap="round"/>
  <path d="M969 160L987 174L969 188" stroke="#93C5FD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(1012 126)">
    <rect x="0" y="0" width="142" height="96" rx="16" fill="#052E2B" stroke="#6FE7A7" stroke-width="2"/>
    <path d="M41 58L62 78L105 28" stroke="#BBF7D0" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="71" y="124" text-anchor="middle" fill="#DCFCE7" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">App</text>
  </g>

  <text x="640" y="318" text-anchor="middle" fill="#DCEFFF" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500">
    Block login at Keycloak when the user does not own the required client role
  </text>
</svg>
