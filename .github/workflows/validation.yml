name: Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: RoleGate validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: validation/.python-version

      - name: Install uv
        run: python -m pip install --user uv

      - name: Add user Python bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run validation
        run: make validation-ci

      - name: Dump Docker Compose logs on failure
        if: failure()
        run: docker compose -f validation/docker-compose.yml logs --no-color

      - name: Clean validation environment
        if: always()
        run: make validation-clean

  release-assets:
    name: Upload release assets
    runs-on: ubuntu-latest
    needs: validation
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Package setup scripts
        run: |
          mkdir -p dist
          zip -j dist/rolegate-scripts.zip \
            scripts/rolegate_setup.py \
            scripts/rolegate-setup.sh

      - name: Upload scripts to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG_NAME" dist/rolegate-scripts.zip --repo "$GITHUB_REPOSITORY" --clobber
