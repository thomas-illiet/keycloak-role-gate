name: E2E validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: RoleGate E2E validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: validation/.python-version

      - name: Install uv
        run: python -m pip install --user uv

      - name: Add user Python bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run E2E validation
        run: make e2e-ci

      - name: Dump Docker Compose logs on failure
        if: failure()
        run: docker compose -f validation/docker-compose.yml logs --no-color

      - name: Clean validation environment
        if: always()
        run: make e2e-clean
