name: keycloak-role-gate-validation

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command:
      - start-dev
      - --http-enabled=true
      - --http-port=8080
      - --hostname=http://localhost:8080
      - --hostname-strict=false
      - --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${ROLEGATE_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ROLEGATE_ADMIN_PASSWORD:-admin}
      JAVA_OPTS_APPEND: ${JAVA_OPTS_APPEND:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 30

  python-app:
    build:
      context: .
    environment:
      ROLEGATE_VALIDATION_SESSION_SECRET: ${ROLEGATE_VALIDATION_SESSION_SECRET:-validation-session-secret-change-me}
      ROLEGATE_VALIDATION_PUBLIC_KEYCLOAK_URL: ${ROLEGATE_VALIDATION_PUBLIC_KEYCLOAK_URL:-http://localhost:8080}
      ROLEGATE_VALIDATION_INTERNAL_KEYCLOAK_URL: ${ROLEGATE_VALIDATION_INTERNAL_KEYCLOAK_URL:-http://keycloak:8080}
      ROLEGATE_REALM: ${ROLEGATE_REALM:-role-gate-validation}
      ROLEGATE_TARGET_CLIENT_ID: ${ROLEGATE_TARGET_CLIENT_ID:-python-app}
      ROLEGATE_VALIDATION_CLIENT_SECRET: ${ROLEGATE_VALIDATION_CLIENT_SECRET:-python-app-secret}
      ROLEGATE_VALIDATION_REDIRECT_URI: ${ROLEGATE_VALIDATION_REDIRECT_URI:-${ROLEGATE_VALIDATION_APP_URL:-http://localhost:8000}/auth/callback}
      ROLEGATE_VALIDATION_OIDC_SCOPE: ${ROLEGATE_VALIDATION_OIDC_SCOPE:-openid profile email}
    ports:
      - "8000:8000"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
