name: keycloak-role-gate-e2e

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command:
      - start-dev
      - --http-enabled=true
      - --http-port=8080
      - --hostname=http://localhost:8080
      - --hostname-strict=false
      - --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_OPTS: "-XX:UseSVE=0"
      JAVA_OPTS_APPEND: "-XX:UseSVE=0"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 30

  python-app:
    build:
      context: .
    environment:
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:-e2e-session-secret-change-me}
      OIDC_PUBLIC_KEYCLOAK_URL: ${OIDC_PUBLIC_KEYCLOAK_URL:-http://localhost:8080}
      OIDC_INTERNAL_KEYCLOAK_URL: ${OIDC_INTERNAL_KEYCLOAK_URL:-http://keycloak:8080}
      OIDC_REALM: ${REALM:-role-gate-e2e}
      OIDC_CLIENT_ID: ${TARGET_CLIENT_ID:-python-app}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-python-app-secret}
      OIDC_REDIRECT_URI: ${APP_BASE_URL:-http://localhost:8000}/auth/callback
    ports:
      - "8000:8000"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
