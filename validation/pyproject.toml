[project]
name = "keycloak-role-gate-validation"
version = "0.1.0"
description = "Local validation app for the RoleGate Keycloak setup"
readme = "README.md"
authors = [
    { name = "Thomas ILLIET", email = "contact@thomas-illiet.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "uvicorn[standard]>=0.48.0",
]

[project.scripts]
keycloak-role-gate-validation = "keycloak_role_gate_validation:main"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-playwright>=0.8.0",
    "ruff>=0.15.14",
    "ty>=0.0.39",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ty.environment]
python-version = "3.12"
